services:
  - type: web
    name: laboratorio-agendamento
    plan: free
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: 'False'
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
